# B-only ACME webroot. No application traffic or unknown Host is served on HTTP.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name backend-us-dev.lute-momcozylab.luteos.cloud agent-us-dev.lute-momcozylab.luteos.cloud;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/momcozy-b-acme;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}
