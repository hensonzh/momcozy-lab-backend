<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Momcozy 数据管理后台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260601-notifications" />
  </head>
  <body>
    <main class="app-shell">
      <section id="login-view" class="login-view">
        <form id="login-form" class="login-panel">
          <h1>数据管理后台</h1>
          <label>
            账号
            <input id="username" name="username" autocomplete="username" value="admin" />
          </label>
          <label>
            密码
            <input id="password" name="password" type="password" autocomplete="current-password" value="admin123" />
          </label>
          <button type="submit">登录</button>
          <p id="login-error" class="error-text"></p>
        </form>
      </section>

      <section id="admin-view" class="admin-view" hidden>
        <header class="topbar">
          <div>
            <h1>Momcozy 数据管理</h1>
            <p id="meta-text">milk_management.db / data/milk_process/configs</p>
          </div>
          <button id="logout-button" type="button">退出</button>
        </header>

        <nav class="tabs" aria-label="管理区域">
          <button class="tab active" data-view="core-view" type="button">核心数据</button>
          <button class="tab" data-view="tables-view" type="button">全部表</button>
          <button class="tab" data-view="files-view" type="button">配置文件</button>
          <button class="tab" data-view="notifications-view" type="button">消息提醒</button>
        </nav>

        <section id="core-view" class="view active-view">
          <div class="toolbar">
            <select id="core-table"></select>
            <select id="core-field">
              <option value="">全部字段</option>
            </select>
            <input id="core-search" placeholder="搜索当前表" />
            <button id="core-refresh" type="button">刷新</button>
            <button id="core-add" type="button">新增</button>
            <button id="core-bulk-delete" class="danger" type="button" disabled>删除所选</button>
            <span id="core-selected-count" class="selection-count">已选 0 条</span>
          </div>
          <div id="core-table-wrap" class="table-wrap"></div>
          <div id="core-pager" class="pager"></div>
        </section>

        <section id="tables-view" class="view">
          <div class="toolbar">
            <select id="all-table"></select>
            <select id="all-field">
              <option value="">全部字段</option>
            </select>
            <input id="all-search" placeholder="搜索当前表" />
            <button id="all-refresh" type="button">刷新</button>
            <button id="all-add" type="button">新增</button>
            <button id="all-bulk-delete" class="danger" type="button" disabled>删除所选</button>
            <span id="all-selected-count" class="selection-count">已选 0 条</span>
          </div>
          <div id="schema-panel" class="schema-panel"></div>
          <div id="all-table-wrap" class="table-wrap"></div>
          <div id="all-pager" class="pager"></div>
        </section>

        <section id="files-view" class="view">
          <div class="file-layout">
            <aside>
              <div class="toolbar stacked">
                <button id="file-refresh" type="button">刷新文件</button>
                <button id="file-new" type="button">新建文件</button>
                <label class="upload-button">
                  上传
                  <input id="file-upload" type="file" hidden />
                </label>
              </div>
              <div id="file-list" class="file-list"></div>
            </aside>
            <article class="editor-panel">
              <div class="editor-toolbar">
                <strong id="file-title">未选择文件</strong>
                <span id="file-status"></span>
                <button id="file-download" type="button" disabled>下载</button>
                <button id="file-delete" type="button" disabled>删除</button>
                <button id="file-save" type="button" disabled>保存</button>
              </div>
              <textarea id="file-editor" spellcheck="false" disabled></textarea>
            </article>
          </div>
        </section>

        <section id="notifications-view" class="view">
          <form id="notification-form" class="notification-panel">
            <h2>消息提醒上报</h2>
            <div class="notification-grid">
              <label>
                消息提醒类型
                <select id="notification-type" required>
                  <option value="task_reminder">任务提醒</option>
                  <option value="lactation_feeding_reminder">泌乳及喂养提醒</option>
                  <option value="daily_summary_reminder">每日小结提醒</option>
                  <option value="baby_growth_update_reminder">宝宝生长发育更新提醒</option>
                </select>
              </label>
              <label>
                WebSocket Token
                <input id="notification-token" placeholder="未配置 WEB_DATA_WS_TOKEN 时可留空" autocomplete="off" />
              </label>
            </div>
            <label>
              标题
              <input id="notification-title" placeholder="例如：今日喂养提醒" />
            </label>
            <label>
              消息内容
              <textarea id="notification-message" rows="4" placeholder="输入要推送给客户端的提醒内容"></textarea>
            </label>
            <label>
              扩展数据 JSON
              <textarea id="notification-data" rows="8" spellcheck="false">{
  "source": "web_data"
}</textarea>
            </label>
            <div class="notification-actions">
              <button id="notification-submit" type="submit">上报消息提醒</button>
              <span id="notification-status"></span>
            </div>
            <p id="notification-error" class="error-text"></p>
          </form>
        </section>
      </section>
    </main>

    <dialog id="row-dialog">
      <form id="row-form" method="dialog">
        <h2 id="row-dialog-title">编辑记录</h2>
        <div id="row-fields" class="row-fields"></div>
        <p id="row-error" class="error-text"></p>
        <footer>
          <button value="cancel" type="button" id="row-cancel">取消</button>
          <button value="default" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="file-dialog">
      <form id="file-form" method="dialog">
        <h2>新建文件</h2>
        <label>
          相对路径
          <input id="new-file-path" placeholder="pump/config.json" />
        </label>
        <label>
          内容
          <textarea id="new-file-content" rows="8"></textarea>
        </label>
        <p id="file-error" class="error-text"></p>
        <footer>
          <button value="cancel" type="button" id="file-cancel">取消</button>
          <button value="default" type="submit">创建</button>
        </footer>
      </form>
    </dialog>

    <script src="/static/app.js?v=20260601-notifications"></script>
  </body>
</html>
