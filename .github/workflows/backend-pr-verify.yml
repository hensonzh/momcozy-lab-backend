name: backend-pr-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and type-check
        run: |
          python -m ruff check app tests scripts
          python -m mypy app scripts
      - name: Test and validate migrations
        run: |
          python -m pytest tests
          python -m alembic -c alembic.ini heads
          python -m alembic -c alembic.ini upgrade head --sql > /tmp/upgrade-head.sql
      - name: Check reviewed API contract
        run: |
          python scripts/export_openapi.py --output /tmp/openapi.generated.json
          diff -u docs/openapi.generated.json /tmp/openapi.generated.json
          python scripts/export_api_surface_catalog.py --openapi-input /tmp/openapi.generated.json --output /tmp/api-surface-catalog.md
          diff -u docs/api-surface-catalog.md /tmp/api-surface-catalog.md
