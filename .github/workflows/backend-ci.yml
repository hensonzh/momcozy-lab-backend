name: backend-ci

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint production backend
        run: python -m ruff check app tests scripts

      - name: Type-check production backend
        run: python -m mypy app scripts

      - name: Run backend tests
        run: python -m pytest tests

      - name: Check Alembic head
        run: python -m alembic -c alembic.ini heads

      - name: Check empty database migration SQL
        run: python -m alembic -c alembic.ini upgrade head --sql > /tmp/upgrade-head.sql

      - name: Check backup restore hook manifest
        run: python scripts/check_backup_restore_hooks.py

      - name: Check OpenAPI snapshot
        run: |
          python scripts/export_openapi.py --output /tmp/openapi.generated.json
          diff -u docs/openapi.generated.json /tmp/openapi.generated.json
          python scripts/export_api_surface_catalog.py --openapi-input /tmp/openapi.generated.json --output /tmp/api-surface-catalog.md
          diff -u docs/api-surface-catalog.md /tmp/api-surface-catalog.md

      - name: Publish Product OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: momcozy-product-openapi
          path: docs/openapi.generated.json

      - name: Scan production backend for legacy runtime references
        run: |
          ! grep -R -E 'previous_response_id|ChatSession|ENTRY_API_KEY|query_params.get\("user_id"|momcozy_agent' \
            app migrations tests
          test ! -d app/agent_runtime
          test ! -d app/agents
          test ! -d app/workers

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose -f docker-compose.local.yml config
          docker compose -f docker-compose.test.yml config
          docker compose -f docker-compose.prod.yml config

      - name: Build backend image
        run: docker build -f Dockerfile .

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: momcozy
          POSTGRES_PASSWORD: momcozy
          POSTGRES_DB: momcozy_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U momcozy -d momcozy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://momcozy:momcozy@localhost:5432/momcozy_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply fresh Product database baseline
        run: python -m alembic -c alembic.ini upgrade head

      - name: Reject ORM-to-database schema drift
        run: python -m alembic -c alembic.ini check

      - name: Verify isolated Product schema
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.settings import Settings

          async def main():
              engine = create_async_engine(Settings.from_env().database_url)
              async with engine.connect() as connection:
                  result = await connection.execute(
                      text(
                          "select table_name from information_schema.tables "
                          "where table_schema = 'public'"
                      )
                  )
                  tables = {row[0] for row in result}
              await engine.dispose()
              required = {
                  "users",
                  "files",
                  "audit_logs",
                  "idempotency_keys",
                  "plans",
                  "feeding_records",
                  "diary_entries",
                  "maternal_current_delivery_infants",
              }
              missing = required - tables
              if missing:
                  raise SystemExit(f"missing tables: {sorted(missing)}")
              unexpected = {
                  table
                  for table in tables
                  if table.startswith(("agent_", "user_fact"))
                  or table == "legacy_agent_context_checkpoints"
              }
              if unexpected:
                  raise SystemExit(f"runtime tables in Product database: {sorted(unexpected)}")

          asyncio.run(main())
          PY

  redis-product-profile:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Product Redis connectivity
        run: python scripts/check_redis_profile.py

  object-storage-integration:
    runs-on: ubuntu-latest
    env:
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_BUCKET: momcozy-test
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start MinIO
        run: |
          docker run -d --name momcozy-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --address ":9000"
          for i in {1..30}; do
            if curl -fs http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs momcozy-minio
          exit 1

      - name: Check object storage profile
        run: python scripts/check_object_storage_profile.py
