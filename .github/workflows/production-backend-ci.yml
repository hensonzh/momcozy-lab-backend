name: production-backend-ci

on:
  pull_request:
    paths:
      - "production_backend/**"
      - ".github/workflows/production-backend-ci.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "production_backend/**"
      - ".github/workflows/production-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r production_backend/requirements-dev.txt

      - name: Lint production backend
        run: cd production_backend && python -m ruff check app tests scripts

      - name: Type-check production backend
        run: cd production_backend && python -m mypy app

      - name: Run backend tests
        run: python -m pytest production_backend/tests

      - name: Check Alembic head
        run: python -m alembic -c production_backend/alembic.ini heads

      - name: Check empty database migration SQL
        run: python -m alembic -c production_backend/alembic.ini upgrade head --sql > /tmp/upgrade-head.sql

      - name: Check backup restore hook manifest
        run: python production_backend/scripts/check_backup_restore_hooks.py

      - name: Check OpenAPI snapshot
        run: |
          python production_backend/scripts/export_openapi.py --output /tmp/openapi.generated.json
          diff -u production_backend/docs/openapi.generated.json /tmp/openapi.generated.json

      - name: Scan production backend for legacy runtime references
        run: |
          ! grep -R -E 'previous_response_id|ChatSession|ENTRY_API_KEY|query_params.get\("user_id"|momcozy_agent' \
            production_backend/app production_backend/migrations production_backend/tests

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose -f production_backend/docker-compose.yml config

      - name: Build backend image
        run: docker build -f production_backend/Dockerfile .

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: momcozy
          POSTGRES_PASSWORD: momcozy
          POSTGRES_DB: momcozy_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U momcozy -d momcozy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://momcozy:momcozy@localhost:5432/momcozy_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r production_backend/requirements-dev.txt

      - name: Upgrade live Postgres to head
        run: python -m alembic -c production_backend/alembic.ini upgrade head

      - name: Verify migrated tables
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from production_backend.app.core.settings import Settings

          async def main():
              engine = create_async_engine(Settings.from_env().database_url)
              async with engine.connect() as connection:
                  result = await connection.execute(
                      text(
                          "select table_name from information_schema.tables "
                          "where table_schema = 'public'"
                      )
                  )
                  tables = {row[0] for row in result}
              await engine.dispose()
              required = {"users", "files", "agent_runs", "agent_eval_cases", "audit_logs"}
              missing = required - tables
              if missing:
                  raise SystemExit(f"missing tables: {sorted(missing)}")

          asyncio.run(main())
          PY
