name: backend-test-delivery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap shared infrastructure, deploy proven main, or roll back.
        required: true
        type: choice
        options:
          - deploy
          - bootstrap
          - rollback
      commit_sha:
        description: Full main-branch commit SHA; required for deploy/bootstrap.
        required: false
        type: string
      confirm_schema_compatible:
        description: Required for rollback; confirms old code can read the current schema.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: read
  packages: read

concurrency:
  group: momcozy-lab-backend-test
  cancel-in-progress: false

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for independent test approval
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_APPROVERS: ${{ vars.TEST_APPROVERS }}
          TEST_APPROVAL_ISSUE: ${{ vars.TEST_APPROVAL_ISSUE }}
        run: |
          set -euo pipefail
          [[ "${TEST_APPROVAL_ISSUE}" =~ ^[1-9][0-9]*$ ]] || {
            echo "TEST_APPROVAL_ISSUE must name the repository's approval issue." >&2
            exit 1
          }

          IFS=',' read -r -a raw_approvers <<< "${TEST_APPROVERS}"
          normalized_approvers=","
          for raw_approver in "${raw_approvers[@]}"; do
            approver="${raw_approver//[[:space:]]/}"
            approver="${approver,,}"
            [[ "${approver}" =~ ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$ ]] || {
              echo "TEST_APPROVERS must be a comma-separated GitHub login allowlist." >&2
              exit 1
            }
            normalized_approvers+="${approver},"
          done
          [[ "${normalized_approvers}" != "," ]] || {
            echo "TEST_APPROVERS must contain at least one GitHub login." >&2
            exit 1
          }

          expected_approval="/approve-test ${GITHUB_REPOSITORY} ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} ${GITHUB_SHA}"
          printf 'Waiting for an allowlisted reviewer to comment:\n%s\n' "${expected_approval}"
          printf 'Approval command: `%s`\n' "${expected_approval}" >> "${GITHUB_STEP_SUMMARY}"

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            candidate_output="$(
              EXPECTED_APPROVAL="${expected_approval}" gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${TEST_APPROVAL_ISSUE}/comments?per_page=100" \
                --jq '.[] | select(.body == env.EXPECTED_APPROVAL) | .user.login'
            )"
            approved_by=""
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              candidate="${candidate,,}"
              if [[ "${normalized_approvers}" == *",${candidate},"* ]]; then
                approved_by="${candidate}"
                break
              else
                echo "Ignoring approval from non-allowlisted user ${candidate}." >&2
              fi
            done <<< "${candidate_output}"
            if [[ -n "${approved_by}" ]]; then
              echo "Test delivery approved by ${approved_by}."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for independent test approval." >&2
          exit 1

  deliver:
    needs: approve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: test
      url: https://backend-test.lute-momcozylab.luteos.cloud:8443
    env:
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      CONFIRM_SCHEMA_COMPATIBLE: ${{ inputs.confirm_schema_compatible }}
      TEST_RELEASE_ROOT: /opt/momcozy-lab
      TEST_ENV_FILE: /opt/momcozy-lab/shared/backend/deploy.env
      TEST_CA_FILE: /etc/nginx/tls/momcozy-ca/ca.pem
      TEST_PUBLIC_URL: https://backend-test.lute-momcozylab.luteos.cloud:8443
      TEST_RELEASE_LOCK: /opt/momcozy-lab/shared/test-release.lock
      REMOTE_RELEASE_TOOL: /tmp/momcozy-backend-release-tool-${{ github.run_id }}-${{ github.run_attempt }}.py
      REMOTE_DOCKER_CONFIG: /tmp/momcozy-backend-docker-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the trusted main release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the authoritative successful-CI image manifest
        if: inputs.operation == 'deploy' || inputs.operation == 'bootstrap'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.test_release import validate_commit_sha

          validate_commit_sha(os.environ["REQUESTED_COMMIT_SHA"])
          PY
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_COMMIT_SHA}^{commit}"
          git merge-base --is-ancestor "${REQUESTED_COMMIT_SHA}" origin/main

          ci_run_id="$(
            gh run list \
              --workflow backend-ci.yml \
              --branch main \
              --commit "${REQUESTED_COMMIT_SHA}" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"
          [[ "${ci_run_id}" =~ ^[0-9]+$ ]]
          image_digest="$(
            gh api --paginate "users/${GITHUB_REPOSITORY_OWNER}/packages/container/momcozy-lab-backend/versions?per_page=100" \
              --jq '.[] | select(.metadata.container.tags[]? == env.REQUESTED_COMMIT_SHA) | .name' \
              | head -n 1
          )"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'RELEASE_COMMIT_SHA=%s\n' "${REQUESTED_COMMIT_SHA}" >> "${GITHUB_ENV}"
          printf 'RELEASE_IMAGE_REF=ghcr.io/%s/momcozy-lab-backend@%s\n' "${GITHUB_REPOSITORY_OWNER}" "${image_digest}" >> "${GITHUB_ENV}"

      - name: Validate rollback confirmation
        if: inputs.operation == 'rollback'
        run: |
          test "${CONFIRM_SCHEMA_COMPATIBLE}" = "true"

      - name: Configure verified SSH host access
        env:
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          install -m 0600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"

      - name: Authenticate the host to GHCR with an ephemeral token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          test -n "${GHCR_TOKEN}"
          printf '%s' "${GHCR_TOKEN}" | ssh -p "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "install -d -m 0700 '${REMOTE_DOCKER_CONFIG}' && DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Install the trusted main release tool on the host
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          scp -P "${TEST_SSH_PORT}" scripts/test_release.py \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:${REMOTE_RELEASE_TOOL}"

      - name: Stage the exact commit without uncommitted files
        if: inputs.operation == 'deploy' || inputs.operation == 'bootstrap'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          archive="${RUNNER_TEMP}/backend-${RELEASE_COMMIT_SHA}.tar.gz"
          git archive --format=tar.gz --output "${archive}" "${RELEASE_COMMIT_SHA}"
          archive_sha256="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          remote_archive="/tmp/momcozy-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp -P "${TEST_SSH_PORT}" "${archive}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:${remote_archive}"
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "python3 '${REMOTE_RELEASE_TOOL}' stage-snapshot --archive '${remote_archive}' --archive-sha256 '${archive_sha256}' --commit-sha '${RELEASE_COMMIT_SHA}' --release-root '${TEST_RELEASE_ROOT}' --attempt-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Bootstrap shared test infrastructure under the host lock
        if: inputs.operation == 'bootstrap'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          release_dir="${TEST_RELEASE_ROOT}/releases/backend/${RELEASE_COMMIT_SHA}"
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1200 '${TEST_RELEASE_LOCK}' env DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' python3 '${REMOTE_RELEASE_TOOL}' bootstrap --image-ref '${RELEASE_IMAGE_REF}' --commit-sha '${RELEASE_COMMIT_SHA}' --repo-dir '${release_dir}' --env-file '${TEST_ENV_FILE}' --release-root '${TEST_RELEASE_ROOT}' --public-url '${TEST_PUBLIC_URL}' --ca-file '${TEST_CA_FILE}'"

      - name: Deploy the immutable image under the host lock
        if: inputs.operation == 'deploy'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          release_dir="${TEST_RELEASE_ROOT}/releases/backend/${RELEASE_COMMIT_SHA}"
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1200 '${TEST_RELEASE_LOCK}' env DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' python3 '${REMOTE_RELEASE_TOOL}' deploy --image-ref '${RELEASE_IMAGE_REF}' --commit-sha '${RELEASE_COMMIT_SHA}' --repo-dir '${release_dir}' --env-file '${TEST_ENV_FILE}' --release-root '${TEST_RELEASE_ROOT}' --public-url '${TEST_PUBLIC_URL}' --ca-file '${TEST_CA_FILE}'"

      - name: Roll back application code without downgrading the database
        if: inputs.operation == 'rollback'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1200 '${TEST_RELEASE_LOCK}' env DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' python3 '${REMOTE_RELEASE_TOOL}' rollback --env-file '${TEST_ENV_FILE}' --release-root '${TEST_RELEASE_ROOT}' --public-url '${TEST_PUBLIC_URL}' --ca-file '${TEST_CA_FILE}' --confirm-schema-compatible"

      - name: Remove ephemeral host registry credentials
        if: always()
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' docker logout ghcr.io >/dev/null 2>&1 || true; rm -f '${REMOTE_DOCKER_CONFIG}/config.json'; rmdir '${REMOTE_DOCKER_CONFIG}' 2>/dev/null || true" || true

      - name: Remove transient SSH material
        if: always()
        run: rm -f "${HOME}/.ssh/id_ed25519"
