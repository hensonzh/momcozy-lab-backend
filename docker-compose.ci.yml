# CI-only override. Use together with docker-compose.local.yml.
name: momcozy-lab-backend-ci

services:
  api:
    image: momcozy-lab-backend:ci
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUTH_JWT_PRIVATE_KEY_B64: ${AUTH_JWT_PRIVATE_KEY_B64:?Set AUTH_JWT_PRIVATE_KEY_B64}
      APP_ENV: test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: momcozy-lab-backend:ci
    environment:
      APP_ENV: test

  # Build this pinned official source locally before Compose.
  minio:
    image: momcozy-staging-minio:9e49d5e7a648f00e
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  minio-init:
    image: momcozy-staging-minio:9e49d5e7a648f00e
    depends_on:
      minio:
        condition: service_healthy
