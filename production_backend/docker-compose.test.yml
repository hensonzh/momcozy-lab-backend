name: momcozy-test-backend

x-backend-image: &backend-image
  image: ${MOMCOZY_BACKEND_IMAGE:-momcozy-production-backend:test}
  build:
    context: ..
    dockerfile: production_backend/Dockerfile
  env_file:
    - ${MOMCOZY_BACKEND_ENV_FILE:-env/compose.test.env}

services:
  api:
    <<: *backend-image
    restart: unless-stopped
    init: true
    ports:
      - "${MOMCOZY_TEST_API_BIND:-127.0.0.1:8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *backend-image
    command: python -m alembic -c production_backend/alembic.ini upgrade head
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy

  agent-worker:
    <<: *backend-image
    command: python -m production_backend.scripts.run_agent_worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  outbox-worker:
    <<: *backend-image
    command: python -m production_backend.scripts.run_outbox_worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  memory-worker:
    <<: *backend-image
    command: python -m production_backend.scripts.run_memory_consolidation
    environment:
      AGENT_MEMORY_CONSOLIDATION_ENABLED: "true"
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: momcozy_test
      POSTGRES_PASSWORD: momcozy_test
      POSTGRES_DB: momcozy_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momcozy_test -d momcozy_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_test_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set test http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb --ignore-existing test/momcozy-test;
      "

volumes:
  postgres_test_data:
  redis_test_data:
  minio_test_data:
