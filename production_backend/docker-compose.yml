name: momcozy-production-backend

services:
  api:
    build:
      context: ..
      dockerfile: production_backend/Dockerfile
    env_file:
      - compose.env.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_object_storage:/workspace/production_backend/.local/object_storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ..
      dockerfile: production_backend/Dockerfile
    command: python -m alembic -c production_backend/alembic.ini upgrade head
    env_file:
      - compose.env.example
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: momcozy
      POSTGRES_PASSWORD: momcozy
      POSTGRES_DB: momcozy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momcozy -d momcozy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_object_storage:
  postgres_data:
  redis_data:
