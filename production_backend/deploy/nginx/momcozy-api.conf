upstream momcozy_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/momcozy-api/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/momcozy-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name lute-momcozylab.luteos.cloud;

    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 60s;

    ssl_certificate /etc/nginx/tls/momcozy-api/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/momcozy-api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MOMCOZY_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /v1/realtime-voice-session {
        proxy_pass http://momcozy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://momcozy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}
