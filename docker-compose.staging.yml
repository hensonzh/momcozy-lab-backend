name: momcozy-lab-backend-staging

x-backend-image: &backend-image
  image: ${MOMCOZY_BACKEND_IMAGE:-momcozy-lab-backend:staging}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${MOMCOZY_BACKEND_ENV_FILE:-env/compose.staging.env}

services:
  api:
    <<: *backend-image
    restart: unless-stopped
    init: true
    ports:
      - "${MOMCOZY_STAGING_API_BIND:-127.0.0.1:8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *backend-image
    command: python -m alembic -c alembic.ini upgrade head
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: momcozy_staging
      POSTGRES_PASSWORD: momcozy_staging
      POSTGRES_DB: momcozy_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momcozy_staging -d momcozy_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_staging_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set staging http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb --ignore-existing staging/momcozy-staging;
      "

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:
