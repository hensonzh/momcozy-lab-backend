name: momcozy-lab-backend-staging

x-backend-image: &backend-image
  image: ${MOMCOZY_BACKEND_IMAGE:?Set MOMCOZY_BACKEND_IMAGE to an immutable digest reference}
  env_file:
    - ${MOMCOZY_BACKEND_ENV_FILE:-env/compose.staging.env}
  environment:
    DATABASE_URL: postgresql+asyncpg://momcozy_staging:${MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD:?Set MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD}@staging-postgres:5432/momcozy_staging
    REDIS_URL: redis://product-backend:${MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD:?Set MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD}@staging-redis:6379/0
    OBJECT_STORAGE_ACCESS_KEY_ID: ${MOMCOZY_STAGING_PRODUCT_MINIO_ACCESS_KEY:?Set MOMCOZY_STAGING_PRODUCT_MINIO_ACCESS_KEY}
    OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MOMCOZY_STAGING_PRODUCT_MINIO_SECRET_KEY:?Set MOMCOZY_STAGING_PRODUCT_MINIO_SECRET_KEY}
    MOMCOZY_STAGING_POSTGRES_ADMIN_PASSWORD: ""
    MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD: ""
    MOMCOZY_STAGING_AGENT_POSTGRES_PASSWORD: ""
    MOMCOZY_STAGING_REDIS_ADMIN_PASSWORD: ""
    MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD: ""
    MOMCOZY_STAGING_AGENT_REDIS_PASSWORD: ""
    MOMCOZY_STAGING_MINIO_ROOT_USER: ""
    MOMCOZY_STAGING_MINIO_ROOT_PASSWORD: ""
    MOMCOZY_STAGING_PRODUCT_MINIO_ACCESS_KEY: ""
    MOMCOZY_STAGING_PRODUCT_MINIO_SECRET_KEY: ""
    MOMCOZY_STAGING_AGENT_MINIO_ACCESS_KEY: ""
    MOMCOZY_STAGING_AGENT_MINIO_SECRET_KEY: ""
  networks:
    - staging

services:
  api:
    <<: *backend-image
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 1g
    ports:
      - "${MOMCOZY_STAGING_API_BIND:-127.0.0.1:8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      staging:
        aliases:
          - product-backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *backend-image
    command: python -m alembic -c alembic.ini upgrade head
    profiles:
      - tools
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    environment:
      POSTGRES_USER: momcozy_staging_admin
      POSTGRES_PASSWORD: ${MOMCOZY_STAGING_POSTGRES_ADMIN_PASSWORD:?Set MOMCOZY_STAGING_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD: ${MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD:?Set MOMCOZY_STAGING_PRODUCT_POSTGRES_PASSWORD}
      MOMCOZY_STAGING_AGENT_POSTGRES_PASSWORD: ${MOMCOZY_STAGING_AGENT_POSTGRES_PASSWORD:?Set MOMCOZY_STAGING_AGENT_POSTGRES_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./deploy/staging/init-postgres.sh:/docker-entrypoint-initdb.d/10-init-momcozy-databases.sh:ro
    networks:
      staging:
        aliases:
          - staging-postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(psql --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\" --tuples-only --no-align --command \"SELECT count(*) FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE (d.datname = 'momcozy_staging' AND r.rolname = 'momcozy_staging') OR (d.datname = 'agent_runtime_staging' AND r.rolname = 'agent_runtime_staging');\")\" = \"2\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    command: ["/usr/local/bin/start-momcozy-redis"]
    environment:
      MOMCOZY_STAGING_REDIS_ADMIN_PASSWORD: ${MOMCOZY_STAGING_REDIS_ADMIN_PASSWORD:?Set MOMCOZY_STAGING_REDIS_ADMIN_PASSWORD}
      MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD: ${MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD:?Set MOMCOZY_STAGING_PRODUCT_REDIS_PASSWORD}
      MOMCOZY_STAGING_AGENT_REDIS_PASSWORD: ${MOMCOZY_STAGING_AGENT_REDIS_PASSWORD:?Set MOMCOZY_STAGING_AGENT_REDIS_PASSWORD}
    volumes:
      - redis_staging_data:/data
      - ./deploy/staging/start-redis.sh:/usr/local/bin/start-momcozy-redis:ro
    tmpfs:
      - /run/redis:mode=0700
    networks:
      staging:
        aliases:
          - staging-redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user staging-admin --pass \"$$MOMCOZY_STAGING_REDIS_ADMIN_PASSWORD\" --no-auth-warning ping | grep -qx PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 1g
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MOMCOZY_STAGING_MINIO_ROOT_USER:?Set MOMCOZY_STAGING_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MOMCOZY_STAGING_MINIO_ROOT_PASSWORD:?Set MOMCOZY_STAGING_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_staging_data:/data
    networks:
      staging:
        aliases:
          - staging-minio
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MOMCOZY_STAGING_MINIO_ROOT_USER:?Set MOMCOZY_STAGING_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MOMCOZY_STAGING_MINIO_ROOT_PASSWORD:?Set MOMCOZY_STAGING_MINIO_ROOT_PASSWORD}
      PRODUCT_MINIO_ACCESS_KEY: ${MOMCOZY_STAGING_PRODUCT_MINIO_ACCESS_KEY:?Set MOMCOZY_STAGING_PRODUCT_MINIO_ACCESS_KEY}
      PRODUCT_MINIO_SECRET_KEY: ${MOMCOZY_STAGING_PRODUCT_MINIO_SECRET_KEY:?Set MOMCOZY_STAGING_PRODUCT_MINIO_SECRET_KEY}
      AGENT_MINIO_ACCESS_KEY: ${MOMCOZY_STAGING_AGENT_MINIO_ACCESS_KEY:?Set MOMCOZY_STAGING_AGENT_MINIO_ACCESS_KEY}
      AGENT_MINIO_SECRET_KEY: ${MOMCOZY_STAGING_AGENT_MINIO_SECRET_KEY:?Set MOMCOZY_STAGING_AGENT_MINIO_SECRET_KEY}
    volumes:
      - ./deploy/staging/minio-product-policy.json:/policies/product-backend.json:ro
      - ./deploy/staging/minio-agent-policy.json:/policies/agent-runtime.json:ro
    networks:
      - staging
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set staging http://staging-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing staging/momcozy-staging
        mc mb --ignore-existing staging/agent-runtime-staging
        mc admin policy create staging product-backend /policies/product-backend.json
        mc admin policy create staging agent-runtime /policies/agent-runtime.json
        mc admin user add staging "$${PRODUCT_MINIO_ACCESS_KEY}" "$${PRODUCT_MINIO_SECRET_KEY}"
        mc admin user add staging "$${AGENT_MINIO_ACCESS_KEY}" "$${AGENT_MINIO_SECRET_KEY}"
        mc admin policy attach staging product-backend --user "$${PRODUCT_MINIO_ACCESS_KEY}"
        mc admin policy attach staging agent-runtime --user "$${AGENT_MINIO_ACCESS_KEY}"
    profiles:
      - tools
    cpus: 0.25
    mem_limit: 256m
    restart: "no"

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:

networks:
  staging:
    name: momcozy-lab-staging
